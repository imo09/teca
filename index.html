/* Layout: una sola barra in alto (icona, schede, impostazioni), sotto una scheda per volta a tutta area */
:root {
  --fondo: #EDEFEC;
  --carta: #F8F9F7;
  --riquadro: #E3E8E5;
  --inchiostro: #0E1D2A;
  --muto: #566470;
  --tenue: #87949F;
  --bordo: #D3DAD6;
  --vetro: #BCC7C3;
  --ottone: #C99A4E;
  --ottone-testo: #876427;
  --avviso: #F2E9DA;
  --errore: #B4544A;
  --t-html: #B07D2F;
  --t-md: #2C7F74;
  --t-txt: #567092;
  --t-img: #85649F;
  --t-libro: #A2563F;
  --t-cbz: #B24F78;
  --t-csv: #3F7A45;
  --t-dati: #4F5FA8;
  --t-codice: #6E6A2A;
  --t-link: #566470;
  --ombra: 0 1px 2px rgba(14, 29, 42, .06), 0 6px 20px rgba(14, 29, 42, .07);
  --ombra-forte: 0 2px 6px rgba(14, 29, 42, .08), 0 18px 40px rgba(14, 29, 42, .16);
  --ui: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Space Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --marchio: "Poppins", "Space Grotesk", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-tema="chiaro"]) {
    --fondo: #0E1D2A; --carta: #14283A; --riquadro: #172C3F; --inchiostro: #E9EDEC;
    --muto: #97A5B0; --tenue: #6C7E8D; --bordo: #233A4E; --vetro: #3A5670;
    --ottone: #E8A867; --ottone-testo: #E8A867; --avviso: #2B2C25; --errore: #E58A7E;
    --t-html: #EBA862; --t-md: #4CC4B2; --t-txt: #8DB2E6; --t-img: #C49DEB; --t-libro: #EE9A80; --t-cbz: #F08DB7;
    --t-csv: #8ACB8A; --t-dati: #A3AEF5; --t-codice: #D4CF7A; --t-link: #97A5B0;
    --ombra: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .28);
    --ombra-forte: 0 2px 6px rgba(0, 0, 0, .35), 0 18px 40px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]:not([data-tema="chiaro"]), :root[data-tema="scuro"] {
  --fondo: #0E1D2A; --carta: #14283A; --riquadro: #172C3F; --inchiostro: #E9EDEC;
  --muto: #97A5B0; --tenue: #6C7E8D; --bordo: #233A4E; --vetro: #3A5670;
  --ottone: #E8A867; --ottone-testo: #E8A867; --avviso: #2B2C25; --errore: #E58A7E;
  --t-html: #EBA862; --t-md: #4CC4B2; --t-txt: #8DB2E6; --t-img: #C49DEB; --t-libro: #EE9A80; --t-cbz: #F08DB7;
  --t-csv: #8ACB8A; --t-dati: #A3AEF5; --t-codice: #D4CF7A; --t-link: #97A5B0;
  --ombra: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .28);
  --ombra-forte: 0 2px 6px rgba(0, 0, 0, .35), 0 18px 40px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
:root[data-tema="chiaro"] { color-scheme: light; }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--fondo); color: var(--inchiostro);
  font: 15px/1.5 var(--ui); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 2px solid var(--ottone); outline-offset: 2px; }
svg { display: block; flex: none; }
.t-html { color: var(--t-html); } .t-md { color: var(--t-md); } .t-txt { color: var(--t-txt); }
.t-img { color: var(--t-img); } .t-link { color: var(--t-link); }
.t-epub, .t-fb2 { color: var(--t-libro); } .t-cbz { color: var(--t-cbz); }
.t-csv { color: var(--t-csv); } .t-json, .t-xml { color: var(--t-dati); } .t-codice { color: var(--t-codice); }
.t-recenti, .t-impostazioni { color: var(--muto); }
@media (max-width: 759px) { .solo-ampio { display: none !important; } }
@media (min-width: 760px) { .solo-stretto { display: none !important; } }

.app { height: 100%; display: flex; flex-direction: column; }

/* Barra unica: icona, schede, impostazioni */
.testa { flex: none; display: flex; align-items: center; gap: 4px; height: 54px; padding: 0 6px 0 6px; border-bottom: 1px solid var(--bordo); }
.marchio { flex: none; display: flex; align-items: center; height: 42px; padding: 0 6px; border-radius: 12px; color: var(--inchiostro); }
.marchio-svg { display: block; height: 28px; width: auto; overflow: visible; }
.marchio-svg .m-cornice { fill: none; stroke: var(--ottone); }
.marchio-svg .m-parola { fill: currentColor; }
.marchio-svg.grande { height: 92px; }
.marchio-svg.firma { height: 34px; color: var(--inchiostro); }
.tasto-icona { flex: none; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; color: var(--muto); }
.tasto-icona[aria-pressed="true"] { color: var(--ottone-testo); }


/* Schede */
.nastro { flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; gap: 6px; padding: 0 4px; overflow-x: auto; scrollbar-width: none; }
.nastro::-webkit-scrollbar { display: none; }
.schede { display: flex; gap: 6px; flex: none; }
.scheda {
  position: relative; flex: none; display: flex; align-items: center; gap: 7px; height: 36px;
  max-width: 210px; padding: 0 3px 0 10px; border-radius: 10px; color: var(--muto); cursor: pointer;
  border: 1px solid var(--bordo); background: transparent;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-x;
  transition: background-color .15s, border-color .15s, box-shadow .15s;
}
.scheda[aria-selected="true"] { background: var(--carta); border-color: var(--vetro); color: var(--inchiostro); box-shadow: var(--ombra); }
.scheda .nome-scheda { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; font-weight: 500; }
.scheda .chiudi { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: var(--tenue); flex: none; }
.scheda.trascinata { z-index: 3; background: var(--carta); color: var(--inchiostro); border-color: var(--vetro); box-shadow: 0 10px 24px rgba(14, 29, 42, .2); transition: none; cursor: grabbing; }
.nastro.trascina .scheda:not(.trascinata) { transition: none; }
.piu { flex: none; height: 38px; min-width: 38px; padding: 0 9px; margin-left: 4px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--inchiostro); color: var(--fondo); font-size: 13.5px; font-weight: 600; white-space: nowrap; box-shadow: var(--ombra); transition: opacity .15s; }
@media (min-width: 760px) { .piu { padding: 0 14px 0 10px; } }

/* Area delle schede */
.schermo { flex: 1; min-height: 0; position: relative; }
.pannello { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--fondo); }
.pannello.via { visibility: hidden; pointer-events: none; }
.pagina { flex: 1; min-height: 0; overflow-y: auto; padding-inline: 18px; }
.colonna { max-width: 720px; margin: 0 auto; padding-block: 22px 48px; display: flex; flex-direction: column; gap: 30px; }
h2.etichetta { margin: 0; font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--muto); font-weight: 500; }

/* Recenti: apertura */
.apertura { display: grid; gap: 12px; }
.apri-file {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 16px 18px;
  border-radius: 14px; background: var(--inchiostro); color: var(--fondo); box-shadow: var(--ombra);
}
.apri-file b { display: block; font-weight: 600; font-size: 16px; }
.apri-file small { display: block; opacity: .72; font-size: 13px; }
.formati { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 2px 2px 0; }
.formato { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muto); }
.link { display: flex; gap: 8px; }
.link input { flex: 1; min-width: 0; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--bordo); background: var(--carta); }
.link input::placeholder { color: var(--tenue); }
.tasto { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--bordo); background: var(--carta); font-weight: 500; }
.tasto.piccolo { min-height: 36px; padding: 0 12px; border-radius: 10px; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; }
.tasto.conferma { color: var(--errore); border-color: var(--errore); font-weight: 600; }
.suggerimento { margin: 0; font-size: 13px; color: var(--muto); }
@media not all and (hover: hover) and (pointer: fine) { .solo-mouse { display: none; } }

/* Preferiti */
.preferiti { background: var(--riquadro); border-radius: 16px; padding: 4px 6px 8px; display: grid; gap: 2px; }
.gruppo-pref { display: flex; align-items: center; gap: 8px; padding: 10px 10px 2px; font-size: 12.5px; font-weight: 600; color: var(--muto); }
.gruppo-pref .conta { font-weight: 400; color: var(--tenue); }
.preferiti .voce .corpo { padding-block: 7px; }
.preferiti .tessera { width: 32px; height: 32px; border-radius: 9px; }
.vuoto-pref { margin: 0; padding: 12px 10px; font-size: 13.5px; color: var(--muto); display: flex; gap: 10px; align-items: center; }

/* Recenti ed esempi */
.intesta { display: flex; align-items: center; justify-content: space-between; min-height: 32px; }
.svuota { color: var(--muto); font-size: 13px; padding: 6px 4px; border-radius: 8px; }
.svuota.conferma { color: var(--errore); font-weight: 600; }
.lista { display: grid; gap: 2px; margin-top: 8px; }
.voce { display: flex; align-items: center; border-radius: 12px; }
.voce .corpo { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px 6px 10px 8px; border-radius: 12px; }
.tessera { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, currentColor 13%, transparent); }
.voce .testi { min-width: 0; display: grid; gap: 1px; }
.voce .titolo { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta { font: 11.5px/1.45 var(--mono); color: var(--muto); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.etichette { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
.tag { font-size: 11px; line-height: 1.6; padding: 0 7px; border-radius: 999px; border: 1px solid var(--bordo); color: var(--muto); }
.tag.forte { border-color: var(--ottone); color: var(--ottone-testo); }
.togli, .stella { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--tenue); flex: none; }
.togli { margin-right: 4px; }

# Benvenuto in teca

teca apre **pagine HTML**, **Markdown**, **testo**, **immagini**, **libri** (EPUB e FB2), **fumetti** (CBZ), **tabelle** (CSV), **dati** (JSON e XML) e **codice**, e li mostra al sicuro sul tuo dispositivo. Non li modifica e non li invia da nessuna parte.

Questo stesso file è un Markdown: puoi leggerlo come guida e come esempio di ciò che teca sa mostrare. Gli altri esempi sono nei **Recenti**, alla voce *Esempi*: li trovi lì in questa prima apertura e poi, quando vuoi, da Impostazioni, Mostra esempi.

## Indice

- [Aprire un file](#aprire-un-file)
- [Le schede](#le-schede)
- [I comandi del file](#i-comandi-del-file)
- [Aspetto: per tutti o per un file](#aspetto-per-tutti-o-per-un-file)
- [Libri e segnalibri](#libri-e-segnalibri)
- [Lettura immersiva](#lettura-immersiva)
- [Preferiti e Recenti](#preferiti-e-recenti)
- [Gli script nei file HTML](#gli-script-nei-file-html)
- [Cosa sa mostrare il Markdown](#cosa-sa-mostrare-il-markdown)

## Aprire un file

1. Tocca **Apri file** nei Recenti, oppure il **+** in fondo alle schede. Puoi scegliere più file insieme.
2. Su computer puoi trascinare i file in qualsiasi punto della finestra.
3. Con teca installata come app: su Android usa **Condividi** dal file e scegli teca; su computer apri i file con teca dal menu **Apri con**.
4. Puoi anche scrivere l'indirizzo di una pagina web, che inizi con `https://`.

L'elenco completo dei formati è nelle **Impostazioni**, alla voce *Formati leggibili*.

## Le schede

Le schede stanno nella barra in alto, accanto all'icona di teca. Quella che stai leggendo è piena, le altre hanno solo il contorno.

| Gesto | Cosa fa |
| --- | --- |
| Tocco su una scheda | la porta davanti |
| Trascinamento (su telefono: tieni premuto, poi sposta) | cambia l'ordine |
| **X** sulla scheda | la chiude |
| Tocco sull'icona di teca | apre i Recenti |
| Ingranaggio in alto a destra | apre le Impostazioni |

## I comandi del file

In alto a destra di ogni file da leggere:

| Icona | Nome | Cosa contiene |
| --- | --- | --- |
| ☰ | **Naviga** | segnalibro nel punto in cui sei, indice, segnalibri |
| Aa | **Aspetto** | grandezza, sfondo e trama, carattere, interlinea, colonna di questo file |
| ⤢ | **Lettura immersiva** | nasconde i comandi, a tutto schermo dove si può |
| ⋯ | **Altro** | preferito, cerca nel testo, schermo sempre acceso, informazioni |

Su computer la stella dei Preferiti e la lente di **Cerca** sono sempre in vista.

## Aspetto: per tutti o per un file

Ci sono due posti, ognuno con il suo compito:

- **Impostazioni** (l'ingranaggio in alto a destra): l'aspetto **generale**, che vale per tutti i file.
- **Aa** nei comandi di un file: l'aspetto di **quel file soltanto**. Le modifiche valgono voce per voce: se cambi solo lo sfondo, la grandezza continua a seguire quella generale.

Un file personalizzato lo riconosci dall'etichetta *Personalizzato*; con **Ripristina generali** torna come gli altri. Nelle Impostazioni trovi l'elenco dei file personalizzati e **Applica a tutti**, che toglie ogni personalizzazione.

## Libri e segnalibri

teca ricorda da sola **dove eri arrivato** in ogni file: quando lo riapri riparte da lì. In **Naviga** trovi l'indice, i tuoi segnalibri e il pulsante **+ Segnalibro** per segnare il punto in cui sei.

Prova con gli esempi *La biblioteca di notte* (EPUB) e *Quattro stagioni* (FB2), o con il fumetto *Il gatto e la luna*.

> I libri protetti da DRM (quasi tutti quelli comprati negli store) non si possono aprire in nessun lettore libero, teca compresa.

## Lettura immersiva

Il pulsante **⤢** nasconde barra e schede e, dove il sistema lo permette, porta teca a tutto schermo. Tocca al centro della pagina per far ricomparire i comandi; per uscire usa il pulsante in basso a destra o il tasto **Esc**.

## Preferiti e Recenti

Tocca la **stella** su un file, nei Recenti o tra i suoi comandi, per tenerlo nei **Preferiti**, in cima ai Recenti e ordinati per tipo.

Preferiti e Recenti ricordano i **nomi** dei file, non il loro contenuto. Per riaprire un file chiuso, toccalo: teca ti chiede di sceglierlo di nuovo dal dispositivo e riparte dal punto in cui eri. Gli esempi invece sono sempre pronti.

## Gli script nei file HTML

Un file HTML può contenere codice che si muove da solo: grafici, calcoli, pulsanti. Per sicurezza teca lo apre con gli script **spenti**: leggi tutto, ma le parti interattive restano ferme.

Se ti fidi del file, tocca l'interruttore **Script**. Anche acceso, il file resta chiuso nella sua teca di vetro: non può leggere né toccare nient'altro.

## Cosa sa mostrare il Markdown

### Testo e collegamenti

Testo in **grassetto**, in *corsivo*, ~~barrato~~ e `codice in linea`. Un collegamento esterno: [nautargo.com](https://nautargo.com). I collegamenti interni scorrono dentro la pagina, come quelli dell'indice.

### Elenchi e caselle

- [x] Titoli su tre livelli
- [x] Tabelle e citazioni
- [x] Caselle da spuntare, in sola lettura
- [ ] Modifica del testo (teca legge, non scrive)

### Codice

```
Lista della spesa
  pane      1
  mele      6
  caffè     250 g
```

<script type="text/plain" id="es-codice">
"""Riepilogo del diario di corsa.

Script di esempio: mostra come teca apre un file di codice,
con i numeri di riga e i colori della sintassi.
Legge diario-di-corsa.csv (separatore punto e virgola, decimali con la virgola).
"""
import csv
from collections import defaultdict


def numero(testo):
    """Converte '12,60' in 12.6"""
    return float(testo.replace(".", "").replace(",", "."))


def secondi(tempo):
    """Converte '01:23:10' in secondi."""
    ore, minuti, sec = (int(x) for x in tempo.split(":"))
    return ore * 3600 + minuti * 60 + sec


def passo(sec_totali, km):
    """Passo medio come 'm:ss' al chilometro."""
    s = round(sec_totali / km)
    return f"{s // 60}:{s % 60:02d}"


km_totali, sec_totali = 0.0, 0  # contatori di tutto il diario
per_percorso = defaultdict(float)

with open("diario-di-corsa.csv", encoding="utf-8") as f:
    for riga in csv.DictReader(f, delimiter=";"):
        km = numero(riga["Km"])
        km_totali += km
        sec_totali += secondi(riga["Tempo"])
        per_percorso[riga["Percorso"]] += km

print(f"Chilometri totali: {km_totali:.2f}".replace(".", ","))
print(f"Passo medio: {passo(sec_totali, km_totali)} min/km")
print("Percorsi più frequentati:")
for nome, km in sorted(per_percorso.items(), key=lambda v: v[1], reverse=True)[:3]:
    print(f"  {nome:<24} {km:6.2f} km".replace(".", ","))
</script>

<body>
<title><p>Quattro stagioni</p></title>
<epigraph><p>Ogni stagione ha la sua luce, basta aspettarla alla finestra.</p><text-author>Detto popolare</text-author></epigraph>
<section>
<title><p>Primavera</p></title>
<poem>
<title><p>Il primo giorno tiepido</p></title>
<stanza>
<v>Il balcone si sveglia per primo,</v>
<v>un geranio prova i suoi colori;</v>
<v>la città apre le finestre</v>
<v>come chi respira dopo un lungo inverno.</v>
</stanza>
</poem>
</section>
<section>
<title><p>Estate</p></title>
<poem>
<title><p>Sera d'agosto</p></title>
<stanza>
<v>Le cicale tacciono tutte insieme,</v>
<v>il mare si fa d'argento;</v>
<v>qualcuno ride sul lungomare</v>
<v>e la notte non ha fretta.</v>
</stanza>
</poem>
<p>Una nota sulla sera d'estate<a l:href="#nota1" type="note">[1]</a>.</p>
</section>
<section>
<title><p>Autunno</p></title>
<poem>
<title><p>Foglie</p></title>
<stanza>
<v>Cadono senza rumore,</v>
<v>gialle, rosse, color tè;</v>
<v>il viale diventa un tappeto</v>
<v>che nessuno ha bisogno di stendere.</v>
</stanza>
<stanza>
<v>Le raccolgo in un libro,</v>
<v>tra una pagina e l'altra:</v>
<v>a primavera, aprendolo,</v>
<v>ritroverò ottobre.</v>
</stanza>
</poem>
</section>
<section>
<title><p>Inverno</p></title>
<poem>
<title><p>Neve</p></title>
<stanza>
<v>Stanotte ha nevicato piano,</v>
<v>il mondo ha abbassato la voce;</v>
<v>anche i passi sul marciapiede</v>
<v>chiedono <emphasis>permesso</emphasis>.</v>
</stanza>
</poem>
<p><strong>Fine della raccolta.</strong> Prova l'indice in Naviga per saltare da una stagione all'altra.</p>
</section>
</body>
<body name="notes">
<title><p>Note</p></title>

<style>
body{margin:0;padding:28px 20px 48px;background:#fffdf8;color:#2b2420;font:16px/1.6 Georgia,"Times New Roman",serif}

<body>
<div class="pagina">
<div class="occhiello">Ricetta di esempio</div>
<h1>Torta di mele soffice</h1>
<div class="dati"><span>Preparazione 25 min</span><span>Cottura 45 min</span><span>Stampo da 24 cm</span></div>
<nav><a href="#ingredienti">Ingredienti</a> - <a href="#procedimento">Procedimento</a> - <a href="#consigli">Consigli</a></nav>

<h2 id="ingredienti">Ingredienti</h2>
<div class="porzioni" id="porzioni"><b>Calcolo delle dosi.</b> Il cursore per cambiare il numero di persone si muove solo con gli script attivi.</div>
<ul class="ingredienti">
<li><span>Mele</span><span class="q" data-q="3" data-u="">3</span></li>
<li><span>Farina 00</span><span class="q" data-q="250" data-u=" g">250 g</span></li>
<li><span>Zucchero</span><span class="q" data-q="150" data-u=" g">150 g</span></li>
<li><span>Uova</span><span class="q" data-q="3" data-u="">3</span></li>
<li><span>Latte</span><span class="q" data-q="100" data-u=" ml">100 ml</span></li>
<li><span>Burro fuso</span><span class="q" data-q="80" data-u=" g">80 g</span></li>
<li><span>Lievito per dolci</span><span class="q" data-q="16" data-u=" g">16 g</span></li>
<li><span>Scorza di limone</span><span class="q" data-q="1" data-u="">1</span></li>
</ul>
<p class="nota">Dosi per 8 persone.</p>

<h2 id="procedimento">Procedimento</h2>
<ol>
<li>Sbuccia le mele, tagliane due a cubetti e una a fettine sottili per la superficie.</li>
<li>Monta le uova con lo zucchero finché il composto è chiaro e spumoso.</li>
<li>Aggiungi il burro fuso, il latte e la scorza di limone grattugiata.</li>
<li>Incorpora la farina setacciata con il lievito, poco alla volta, mescolando dal basso verso l'alto.</li>
<li>Unisci i cubetti di mele, versa nello stampo imburrato e decora con le fettine.</li>
<li>Cuoci in forno statico a 180 °C per circa 45 minuti: fai la prova dello stecchino.</li>
</ol>

<h2 id="consigli">Consigli</h2>
<p>Una spolverata di zucchero di canna sulle fettine prima di infornare forma una crosticina dorata. La torta si conserva morbida per due o tre giorni sotto una campana di vetro.</p>
<p class="nota">Questa pagina è un esempio: mostra come teca apre un file HTML, con gli script spenti finché non li accendi tu.</p>
</div>
<script>
var box = document.getElementById('porzioni');
box.innerHTML = '<label for="p">Persone: <b id="pv">8</b></label><input id="p" type="range" min="2" max="16" step="1" value="8">';
var r = document.getElementById('p');
function calcola() {
  var k = r.value / 8;
  document.getElementById('pv').textContent = r.value;
  document.querySelectorAll('.q').forEach(function (e) {
    var v = parseFloat(e.dataset.q) * k;
    var t = e.dataset.u ? Math.round(v / 5) * 5 : Math.max(1, Math.round(v));
    e.textContent = t + e.dataset.u;
  });
  document.querySelector('.nota').textContent = 'Dosi per ' + r.value + ' persone.';
}
r.addEventListener('input', calcola);
</script>

        ? 'Si vedono con Safari su iPhone, iPad e Mac. Altrove, convertila in JPG dal telefono o con l\'app Foto e aprila di nuovo.'
        : 'Il file potrebbe essere danneggiato o in un formato che questo browser non conosce.';
      p.appendChild(c);
    };
    img.src = s.url;
    azioni.addEventListener('click', function (e) {
      var b = e.target.closest('[data-z]');
      if (!b || !s.zoom.nw) return;
      var z = s.zoom, cx = box.clientWidth / 2, cy = box.clientHeight / 2;
      if (b.dataset.z === 'piu') imposta(s, z.scala * 1.25, cx, cy);
      else if (b.dataset.z === 'meno') imposta(s, z.scala / 1.25, cx, cy);
      else if (z.adatta && scalaAdatta(z) < 1) imposta(s, 1, cx, cy);
      else adatta(s);
    });
    box.addEventListener('wheel', function (e) {
      if (!e.ctrlKey || !s.zoom.nw) return;
      e.preventDefault();
      var r = box.getBoundingClientRect();
      imposta(s, s.zoom.scala * Math.exp(-e.deltaY * 0.0045), e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });
    var pizzico = null;
    function distanza(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
    box.addEventListener('touchstart', function (e) {
      if (e.touches.length === 2 && s.zoom.nw) {
        var r = box.getBoundingClientRect();
        pizzico = { d0: distanza(e.touches), s0: s.zoom.scala, cx: (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left, cy: (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top };
      }
    }, { passive: true });
    box.addEventListener('touchmove', function (e) {
      if (pizzico && e.touches.length === 2) {
        e.preventDefault();
        imposta(s, pizzico.s0 * distanza(e.touches) / pizzico.d0, pizzico.cx, pizzico.cy);
      }
    }, { passive: false });
    box.addEventListener('touchend', function (e) { if (e.touches.length < 2) pizzico = null; });
    var ultimo = { t: 0, x: 0, y: 0 }, ultimoTocco = 0;
    box.addEventListener('pointerup', function (e) {
      if (e.pointerType === 'mouse') return;
      var ora = Date.now();
      ultimoTocco = ora;
      if (pizzico) return;
      if (ora - ultimo.t < 320 && Math.hypot(e.clientX - ultimo.x, e.clientY - ultimo.y) < 30) {
        ultimo.t = 0;
        doppio(s, e);
      } else ultimo = { t: ora, x: e.clientX, y: e.clientY };
    });
    box.addEventListener('dblclick', function (e) {
      if (Date.now() - ultimoTocco < 800) return;
      doppio(s, e);
    });
  }
  function scalaAdatta(z) {
    var w = z.box.clientWidth - 40, h = z.box.clientHeight - 40;
    if (w <= 0 || h <= 0) return 1;
    return Math.min(1, w / z.nw, h / z.nh);
  }
  function adatta(s) {
    var z = s.zoom;
    if (!z || !z.nw) return;
    imposta(s, scalaAdatta(z), 0, 0, true);
  }
  function imposta(s, scala, cx, cy, adattata) {
    var z = s.zoom, box = z.box;
    var minimo = Math.min(scalaAdatta(z), 1) * 0.5;
    scala = Math.max(minimo, Math.min(8, scala));
    var vecchiaL = box.scrollWidth, vecchiaA = box.scrollHeight;
    var fx = (box.scrollLeft + cx) / (vecchiaL || 1), fy = (box.scrollTop + cy) / (vecchiaA || 1);
    z.scala = scala;
    z.adatta = !!adattata;
    z.img.style.width = Math.round(z.nw * scala) + 'px';
    if (!adattata) {
      box.scrollLeft = fx * box.scrollWidth - cx;
      box.scrollTop = fy * box.scrollHeight - cy;
    }
    if (z.misura) {
      z.misura.textContent = Math.round(scala * 100) + '%';
      z.misura.setAttribute('aria-label', adattata ? 'Adattata allo schermo: tocca per la dimensione reale' : 'Ingrandimento ' + Math.round(scala * 100) + '%: tocca per adattare');
    }
  }
  function doppio(s, e) {
    var z = s.zoom;
    if (!z.nw) return;
    var r = z.box.getBoundingClientRect();
    if (z.adatta) {
      var f = scalaAdatta(z);
      imposta(s, f < 1 ? 1 : Math.min(8, f * 2), e.clientX - r.left, e.clientY - r.top);
    } else adatta(s);
  }
  window.addEventListener('resize', function () {
    var s = cercaScheda(attiva);
    if (s && s.tipo === 'img' && s.zoom && s.zoom.adatta) adatta(s);
    if (s && s.pop && s.pops[s.pop]) s.pops[s.pop].style.top = (s.barra.offsetHeight + 6) + 'px';
  });

  /* ---------- scelta e rilascio dei file ---------- */
  var scegli = $('#scegli');
  scegli.setAttribute('accept', ['.html', '.htm', '.xhtml', '.md', '.markdown', '.txt', '.text', '.log', 'image/*', '.heic', '.heif', '.svg', '.epub', 'application/epub+zip', '.fb2', '.cbz',
    '.csv', '.tsv', 'text/csv', '.json', '.geojson', 'application/json', '.xml', '.kml', '.gpx', '.rss', '.xsd', '.plist', 'text/xml', 'application/xml'].concat(Object.keys(CODICE).map(function (e) { return '.' + e; })).join(','));
  function scegliFile() { scegli.click(); }
  scegli.addEventListener('change', function () {
    apriFiles(this.files).then(function () { scegli.value = ''; });
  });
  var rilascio = $('#rilascio'), profondita = 0;
  function conFile(e) { return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0; }
  window.addEventListener('dragenter', function (e) { if (!conFile(e)) return; e.preventDefault(); profondita++; rilascio.hidden = false; });
  window.addEventListener('dragover', function (e) { if (!conFile(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  window.addEventListener('dragleave', function (e) { if (!conFile(e)) return; profondita = Math.max(0, profondita - 1); if (!profondita) rilascio.hidden = true; });

    if (!conFile(e)) return;

  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'f' || e.key === 'F')) {
      var s = cercaScheda(attiva);
      if (s && s.cercaBar) { e.preventDefault(); apriCerca(s); }
    }
  });

  /* ---------- avvisi ---------- */
  var toast = $('#toast'), toastTimer = null;
  function mostraToast(testo, err, azione) {
    $('#toastTesto').textContent = testo;
    var b = $('#toastAzione');
    b.hidden = !azione;
    b.onclick = null;
    if (azione) { b.textContent = azione.testo; b.onclick = function () { nascondiToast(); azione.fai(); }; }
    toast.classList.toggle('errore', !!err);
    toast.classList.add('su');
    clearTimeout(toastTimer);
    if (!azione || !azione.fisso) toastTimer = setTimeout(nascondiToast, err ? 6000 : (azione ? 5000 : 3200));
  }
  function nascondiToast() { toast.classList.remove('su'); }

  /* Conferma nello stile di teca: risolve true se chi legge sceglie di proseguire */
  var avviso = $('#avviso'), codaAvvisi = Promise.resolve();
  function chiediConferma(titolo, testo, testoSi) {
    var p = codaAvvisi.then(function () {
      return new Promise(function (fatto) {
        $('#avvisoTitolo').textContent = titolo;
        $('#avvisoTesto').textContent = testo;
        $('#avvisoSi').textContent = testoSi;
        function fine(si) {
          avviso.removeEventListener('close', suChiudi);
          if (avviso.open) avviso.close();
          fatto(si);
        }
        /* un close rimasto in coda dall'avviso precedente arriva a finestra già riaperta: si ignora */
        function suChiudi() { if (!avviso.open) fine(false); }
        $('#avvisoSi').onclick = function () { fine(true); };
        $('#avvisoNo').onclick = function () { fine(false); };
        avviso.addEventListener('close', suChiudi);
        if (avviso.showModal) { avviso.showModal(); $('#avvisoSi').focus(); }
        else fine(window.confirm(titolo + '\n\n' + testo));
      });
    });
    codaAvvisi = p.then(null, function () {});
    return p;
  }

  /* ---------- tema che cambia da fuori ---------- */
  if (window.matchMedia) {
    var mq = matchMedia('(prefers-color-scheme: dark)');
    var suCambio = function () { if (IMP.tema === 'auto') { applicaTema(); dopoImpostazioni(); } };
    if (mq.addEventListener) mq.addEventListener('change', suCambio); else if (mq.addListener) mq.addListener(suCambio);
  }
  new MutationObserver(function () { if (IMP.tema === 'auto') dopoImpostazioni(); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  /* ---------- splash ---------- */
  function splash() {
    var sp = $('#splash');
    var giaVista = false;
    try { giaVista = sessionStorage.getItem('teca.avviata') === '1'; sessionStorage.setItem('teca.avviata', '1'); } catch (e) {}
    var ridotto = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!IMP.splash || giaVista || ridotto) return;
    $('#splashIn').innerHTML = svgParola('grande') + '<div class="splash-motto">I tuoi file, da leggere al sicuro.</div>';
    sp.hidden = false;
    var finito = false;
    function chiudi() {
      if (finito) return;
      finito = true;
      sp.classList.add('via');
      setTimeout(function () { sp.hidden = true; sp.classList.remove('via'); }, 380);
    }
    sp.addEventListener('click', chiudi);
    setTimeout(chiudi, 2100);
  }

  /* ---------- avvio ---------- */
  $('#bMarchio').innerHTML = svgParola();
  $('#bImpostazioni').innerHTML = icona('impostazioni', 22, 1.6);
  $('#bPiu').innerHTML = icona('piu', 20) + '<span class="solo-ampio">Apri file</span>';
  $('#rilascioFormati').innerHTML = formatiHtml();
  $('#bMarchio').addEventListener('click', function () { apriSpeciale('recenti'); });
  $('#bImpostazioni').addEventListener('click', function () { apriSpeciale('impostazioni'); });
  $('#bPiu').addEventListener('click', scegliFile);
  applicaTema();

  var salvate = leggi('teca.schede');
  var conSalvate = salvate && Array.isArray(salvate.ordine) && salvate.ordine.length;
  var primaApertura = !conSalvate && !leggi('teca.avviata');
  scrivi('teca.avviata', true);
  mostraEsempi = primaApertura || !!IMP.esempi;
  /* Benvenuto ed esempi solo alla prima apertura: dalla seconda le schede di esempio non tornano */
  var iniziali = primaApertura ? [{ k: 'recenti' }, { k: 'esempio', id: 'es-md' }] :
    conSalvate ? salvate.ordine.filter(function (k) { return k.k !== 'esempio'; }) : [{ k: 'recenti' }];
  var giaAttiva = conSalvate && salvate.ordine[salvate.attiva];
  var daAttivare = primaApertura ? 1 : Math.max(0, iniziali.indexOf(giaAttiva));
  var create = [];
  iniziali.forEach(function (k) {
    var d = null;
    try {
      if (k.k === 'recenti' || k.k === 'impostazioni') d = { tipo: k.k, chiave: k.k };
      else if (k.k === 'esempio' && ESEMPI[k.id]) d = datiEsempio(k.id);
      else if (k.k === 'link' && k.url) d = datiLink(k.url);
    } catch (err) { d = null; }
    if (d && /:/.test(d.chiave)) d.script = scriptRicordati(d.chiave);
    if (d && !schedaPer(d.chiave)) create.push(aggiungiScheda(d));
  });
  if (!schede.length) aggiungiScheda({ tipo: 'recenti', chiave: 'recenti' });
  attiva_((create[daAttivare] || schede[0]).id);
  salvaRecenti();
  splash();

  /* ---------- app installata: apri con, condividi, aggiornamenti ---------- */
  if ('launchQueue' in window && window.launchQueue && launchQueue.setConsumer) {
    launchQueue.setConsumer(function (params) {
      if (!params.files || !params.files.length) return;
      Promise.all(params.files.map(function (h) { return h.getFile(); })).then(apriFiles);
    });
  }
  if (/[?&]condiviso=1/.test(location.search) && window.caches) {
    caches.open('teca-condivisi').then(function (c) {
      return c.keys().then(function (chiavi) {
        return chiavi.reduce(function (p, req) {
          return p.then(function () {
            return c.match(req).then(function (res) {
              if (/\/condivisi\/link$/.test(req.url)) return res.text().then(function (u) { apriLink(u); });
              var nome = decodeURIComponent(res.headers.get('X-Nome') || 'file');
              return res.blob().then(function (b) { return apriFile(new File([b], nome, { type: b.type })); });
            });

        }, Promise.resolve());

      try { history.replaceState(null, '', location.pathname); } catch (e) {}

    navigator.serviceWorker.register('sw.js').then(function (reg) {
      function pronta(w) {
        mostraToast('Nuova versione di teca pronta.', false, { testo: 'Ricarica', fisso: true, fai: function () { w.postMessage('aggiorna'); } });
      }
      if (reg.waiting && navigator.serviceWorker.controller) pronta(reg.waiting);
      reg.addEventListener('updatefound', function () {
        var w = reg.installing;

        });
      });

    }).catch(function () {});

    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (ricaricata || !giaControllata) return;
      ricaricata = true;
      location.reload();
    });
  }

  window.teca = { versione: VERSIONE, schede: function () { return schede; }, recenti: function () { return recenti; }, preferiti: function () { return preferiti; }, segnalibri: function () { return segnalibri; }, posizioni: function () { return posizioni; }, personalizzati: function () { return PERS; }, imp: IMP };
})();
